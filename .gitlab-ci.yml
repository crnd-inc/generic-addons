image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:19.0-simple

variables:
    SERIES_BRANCH: '19.0'
    ODOO_ADMIN_PASS: admin
    CI_JOB_TOKEN_GIT_HOST: 'gitlab.crnd.pro'

    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.hidden-pip-cache"

.only-stable-branch: &only_stable_branch
    only:
        - "19.0"

.only-dev-branch: &only_dev_branch
    only:
        - /^19.0-.*$/

.except-auto-commits: &except_auto_commits
    except:
        variables:
            - $CI_COMMIT_MESSAGE =~ /\[CI-AUTO-UPDATE\]/
            - $CI_COMMIT_MESSAGE =~ /Translated using Weblate/

.except-port-branches: &except_port_branches
    except:
        - /^19\.0-port.*$/

# Disable global cache
cache: {}

.pip_cache: &pip_cache_definition
    cache:
        key: ${CI_JOB_NAME}
        paths:
            - "${PIP_CACHE_DIR}"

stages:
    - static-test
    - test
    - deploy

build_env:
    stage: static-test
    script:
        - pwd
        - whoami
        - odood --version
        - odood info
        - echo "Checking branch compatability $CI_COMMIT_BRANCH" && [[ "$CI_COMMIT_BRANCH" =~ ^19.0(-.*)?$ ]]

flake8:
    stage: static-test
    before_script:
        - odood pre-commit init --odoo-helper-compat --force --no-setup .
    script:
        - odood venv run -- flake8 $(odood addons list --installable --by-path .)
    <<: *except_auto_commits

pylint:
    stage: static-test
    before_script:
        - odood pre-commit init --odoo-helper-compat --force --no-setup .
        - odood addons generate-py-requirements $(odood addons list --installable --by-path . | sed 's/^/--dir=/') -o /tmp/py-requirements.txt
        - odood venv pip -- install -r /tmp/py-requirements.txt
    script:
        - odood venv run -- pylint --rcfile=.pylintrc --valid_odoo_versions=$SERIES_BRANCH -d manifest-required-author $(odood addons list --installable --by-path .)
    <<: *except_auto_commits

stylelint:
    stage: static-test
    before_script:
        - odood venv npm -- install -g stylelint stylelint-config-standard stylelint-config-standard-scss postcss-less postcss-scss
        - echo '{"extends":"stylelint-config-standard"}' > /tmp/stylelint.json
        - echo '{"extends":"stylelint-config-standard","rules":{"indentation":4}}' > /tmp/stylelint-less.json
        - echo '{"extends":"stylelint-config-standard-scss","rules":{"indentation":4}}' > /tmp/stylelint-scss.json
    script:
        - odood venv run -- stylelint --allow-empty-input --config /tmp/stylelint.json "**/*.css" "!**/static/lib/**"
        - odood venv run -- stylelint --allow-empty-input --custom-syntax=postcss-less --config /tmp/stylelint-less.json "**/*.less" "!**/static/lib/**"
        - odood venv run -- stylelint --allow-empty-input --custom-syntax=postcss-scss --config /tmp/stylelint-scss.json "**/*.scss" "!**/static/lib/**"
    allow_failure: true
    <<: *except_auto_commits

bandit:
    stage: static-test
    <<: *pip_cache_definition
    before_script:
        - odood venv pip -- install bandit
    script:
        - odood venv run -- bandit -r .
    <<: *except_auto_commits

check-versions:
    stage: static-test
    script:
        - odood repo check-versions --ignore-translations .
    <<: *only_dev_branch
    <<: *except_auto_commits
    <<: *except_port_branches

ensure-changelog:
    stage: static-test
    script:
        - odood repo ensure-changelog . --start-ref "origin/$SERIES_BRANCH" --end-ref "$CI_COMMIT_SHA"
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits

ensure-icons:
    stage: static-test
    script:
        - |
          res=0
          for addon in $(odood addons list --installable --by-path .); do
              if [ ! -f "$addon/static/description/icon.png" ]; then
                  echo "ERROR: addon $addon has no icon!"
                  res=1
              fi
          done
          exit $res
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits


tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:19.0-ci
    stage: test
    <<: *pip_cache_definition
    before_script:
        # temporary disable before port crnd_web repository
#        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
    script:
        odood test --temp-db --isw --coverage --coverage-report --coverage-skip-covered --coverage-fail-under 80 --dir .
    <<: *except_auto_commits
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'

test_installation_no_demo:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:19.0-ci
    stage: test
    variables:
        ODOO_DB_NAME: test-db-clean
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update && sudo apt-get install -y libmagic1
        # TODO: Use Odood here too
        - odood addons link -r .
        - odood db create $ODOO_DB_NAME
    script:
        - odood addons install --db "$ODOO_DB_NAME" --ual --dir-r .
    <<: *except_auto_commits

migration_tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:19.0-ci
    stage: test
    variables:
        ODOO_DB_NAME: test-db
    <<: *pip_cache_definition
    before_script:
        - odood addons link -f .
    script:
        - odood test -t --migration --isw --error-report --coverage --coverage-report --coverage-skip-covered --coverage-fail-under=10 --dir-r .
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    <<: *only_dev_branch
    <<: *except_auto_commits
    allow_failure: true

update_addons_list_and_trans:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:19.0-ci
    stage: deploy
    before_script:
        - odood addons link -r .
    script:
        - odood addons list --installable --field name --field license --field version --field summary --field price --csv . > ./ADDONS.csv
        - odood addons list --installable --field name --field license --field version --field summary --field price --md . > ./ADDONS.md
        - odood tr regenerate --lang-file "uk_UA:uk" --lang-file "ru_RU:ru" --lang-file "de_DE:de" --lang-file "fr_FR:fr" --lang-file "lt_LT:lt" --pot --pot-remove-dates --missing-only --pot-update --addon-dir .
        - git add ./ADDONS.csv ./ADDONS.md "*.po" "*.pot"
        - git -c "user.name=${GITLAB_USER_NAME}" -c "user.email=${GITLAB_USER_EMAIL}" commit -m "[CI-AUTO-UPDATE]"
        - echo "$CI_SSH_PRIVATE_KEY" > /tmp/push_key && chmod 600 /tmp/push_key
        - git remote set-url --push origin "git@${CI_JOB_TOKEN_GIT_HOST}:${CI_PROJECT_PATH}"
        - git -c core.sshCommand='ssh -T -o PasswordAuthentication=no -o StrictHostKeyChecking=no -i /tmp/push_key' push origin "HEAD:${CI_COMMIT_BRANCH}"
    <<: *only_stable_branch
    <<: *except_auto_commits
    allow_failure: true

.deploy_review_definition: &deploy_review_definition
    stage: deploy
    before_script:
        - ci-review-app init
    script:
        - ci-review-app start
    tags:
        - deploy
        - odoo-review-ci4-shared
        - review-apps


deploy_review_dev:
    <<: *deploy_review_definition
    environment:
        name: review/$CI_COMMIT_REF_NAME
        url: http://$CI_ENVIRONMENT_SLUG-$CI_PROJECT_ID.ci4.crnd.pro
        on_stop: stop_review_dev
        auto_stop_in: 1 week
    <<: *only_dev_branch
    when: manual

deploy_review_stable:
    <<: *deploy_review_definition
    environment:
        name: stable/$CI_COMMIT_REF_NAME
        url: http://$CI_ENVIRONMENT_SLUG-$CI_PROJECT_ID.ci4.crnd.pro
    <<: *only_stable_branch

stop_review_dev:
    stage: deploy
    environment:
        name: review/$CI_COMMIT_REF_NAME
        action: stop
    variables:
        GIT_STRATEGY: none
    script:
        - ci-review-app stop
    when: manual
    tags:
        - deploy
        - odoo-review-ci4-shared
        - review-apps
    <<: *only_dev_branch
